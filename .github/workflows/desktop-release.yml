name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: deb
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: app
            artifact: pkg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: bun install
        working-directory: desktop
      - if: runner.os == 'macOS'
        run: uv sync --extra desktop-build --extra mlx
      - if: runner.os != 'macOS'
        run: uv sync --extra desktop-build
      - run: uv run python scripts/build_desktop_sidecar.py --target-triple ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: bun tauri build --bundles nsis
        working-directory: desktop
      - if: runner.os != 'Windows' && runner.os != 'macOS'
        run: bun tauri build --bundles deb
        working-directory: desktop
      - if: runner.os == 'macOS'
        run: |
          bun tauri build --bundles app
          cd ..
          bash scripts/package_macos_pkg.sh
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: makeitdrumless-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**/*.{deb,pkg,exe}
          if-no-files-found: error
